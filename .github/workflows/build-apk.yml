name: Build Calculator APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
- name: Set up Android
        uses: android-actions/setup-android@v3

- name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

- name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

- name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/prank/calculator

cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PrankCalculator"
          include(":app")
          EOF

cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

android {
              namespace 'com.prank.calculator'
              compileSdk 35

defaultConfig {
                  applicationId 'com.prank.calculator'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Calculator"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

cat > app/src/main/java/com/prank/calculator/MainActivity.java <<'EOF'
          package com.prank.calculator;

import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

public class MainActivity extends Activity {
              private String expression = "";
              private boolean answered = false;
              private TextView history;
              private TextView display;

@Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

if (state != null) {
                      expression = state.getString("expression", "");
                      answered = state.getBoolean("answered", false);
                  }

getWindow().setStatusBarColor(Color.rgb(15, 18, 25));
                  getWindow().setNavigationBarColor(Color.rgb(15, 18, 25));

LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(16), dp(16), dp(16));
                  root.setBackgroundColor(Color.rgb(15, 18, 25));
                  setContentView(root);

TextView title = new TextView(this);
                  title.setText("Calculator");
                  title.setTextSize(20);
                  title.setTextColor(Color.rgb(160, 172, 192));
                  root.addView(title);

LinearLayout screen = new LinearLayout(this);
                  screen.setOrientation(LinearLayout.VERTICAL);
                  screen.setGravity(Gravity.BOTTOM | Gravity.END);
                  screen.setPadding(dp(8), dp(16), dp(8), dp(24));
                  root.addView(screen, new LinearLayout.LayoutParams(
                      -1, 0, 1f));

history = new TextView(this);
                  history.setTextSize(20);
                  history.setTextColor(Color.rgb(145, 155, 175));
                  history.setGravity(Gravity.END);
                  history.setMaxLines(2);
                  screen.addView(history, new LinearLayout.LayoutParams(-1, -2));

display = new TextView(this);
                  display.setTextSize(36);
                  display.setTextColor(Color.WHITE);
                  display.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  display.setGravity(Gravity.END);
                  display.setMaxLines(2);
                  display.setPadding(0, dp(12), 0, 0);
                  display.setAccessibilityLiveRegion(
                      View.ACCESSIBILITY_LIVE_REGION_POLITE);
                  screen.addView(display, new LinearLayout.LayoutParams(-1, -2));

String[][] keys = {
                      {"C", "±", "%", "÷"},
                      {"7", "8", "9", "×"},
                      {"4", "5", "6", "−"},
                      {"1", "2", "3", "+"},
                      {"⌫", "0", ".", "="}
                  };

for (String[] rowKeys : keys) {
                      LinearLayout row = new LinearLayout(this);
                      root.addView(row, new LinearLayout.LayoutParams(
                          -1, 0, 0.48f));

for (String key : rowKeys) {
                          Button button = new Button(this);
                          button.setText(key);
                          button.setTextSize(25);
                          button.setTextColor(Color.WHITE);
                          button.setAllCaps(false);
                          button.setMinHeight(0);
                          button.setMinimumHeight(0);
                          button.setPadding(0, 0, 0, 0);

boolean accent = isOperator(key) || key.equals("=");
                          int color = accent
                              ? Color.rgb(92, 78, 220)
                              : Color.rgb(31, 38, 52);

GradientDrawable background = new GradientDrawable();
                          background.setColor(color);
                          background.setCornerRadius(dp(20));
                          button.setBackground(background);

LinearLayout.LayoutParams params =
                              new LinearLayout.LayoutParams(0, -1, 1f);
                          params.setMargins(dp(4), dp(4), dp(4), dp(4));
                          row.addView(button, params);

if (key.equals("⌫")) {
                              button.setContentDescription("Backspace");
                              button.setOnLongClickListener(v -> {
                                  expression = "";
                                  answered = false;
                                  render();
                                  return true;
                              });
                          }

button.setOnClickListener(v -> press(key));
                      }
                  }
                  render();
              }

private void press(String key) {
                  if (key.equals("C")) {
                      expression = "";
                      answered = false;
                  } else if (key.equals("=")) {
                      answered = true;
                  } else if (key.equals("⌫")) {
                      answered = false;
                      if (!expression.isEmpty()) {
                          expression = expression.substring(
                              0, expression.length() - 1);
                      }
                  } else {
                      if (answered) {
                          expression = "";
                          answered = false;
                      }

if (key.equals("±")) {
                          int start = numberStart();
                          String number = expression.substring(start);
                          if (number.startsWith("-")) {
                              expression = expression.substring(0, start)
                                  + number.substring(1);
                          } else {
                              expression = expression.substring(0, start)
                                  + "-" + number;
                          }
                      } else if (isOperator(key)) {
                          if (expression.isEmpty()) {
                              if (key.equals("−")) expression = "-";
                          } else {
                              String last = expression.substring(
                                  expression.length() - 1);
                              if (isOperator(last)) {
                                  expression = expression.substring(
                                      0, expression.length() - 1) + key;
                              } else if (!last.equals("-")) {
                                  expression += key;
                              }
                          }
                      } else if (key.equals(".")) {
                          String number = expression.substring(numberStart());
                          if (!number.contains(".") && !number.endsWith("%")) {
                              expression +=
                                  (number.isEmpty() || number.equals("-"))
                                  ? "0." : ".";
                          }
                      } else if (key.equals("%")) {
                          if (!expression.isEmpty()) {
                              char last = expression.charAt(
                                  expression.length() - 1);
                              if (Character.isDigit(last)) expression += "%";
                          }
                      } else {
                          if (expression.endsWith("%")) expression += "×";
                          expression += key;
                      }
                  }
                  render();
              }

private int numberStart() {
                  for (int i = expression.length() - 1; i >= 0; i--) {
                      if (isOperator(String.valueOf(expression.charAt(i)))) {
                          return i + 1;
                      }
                  }
                  return 0;
              }

private boolean isOperator(String key) {
                  return key.equals("+") || key.equals("−")
                      || key.equals("×") || key.equals("÷");
              }

private void render() {
                  history.setText(answered
                      ? (expression.isEmpty() ? "" : expression + " =")
                      : "");
                  display.setTextSize(answered ? 28 : 36);
                  display.setText(answered
                      ? "idk ask chatgpt"
                      : (expression.isEmpty() ? "0" : expression));
              }

private int dp(int value) {
                  return Math.round(
                      value * getResources().getDisplayMetrics().density);
              }

@Override
              protected void onSaveInstanceState(Bundle state) {
                  state.putString("expression", expression);
                  state.putBoolean("answered", answered);
                  super.onSaveInstanceState(state);
              }
          }
          EOF

- name: Build installable APK
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk PrankCalculator.apk

- name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prank-Calculator-APK
          path: PrankCalculator.apk
